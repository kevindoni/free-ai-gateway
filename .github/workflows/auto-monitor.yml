name: Auto Monitor & Bansos Discovery

on:
  schedule:
    # Health check every 30 minutes (stays well within free tier minutes)
    - cron: '*/30 * * * *'
    # Bansos discovery every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run provider health check
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
        run: |
          npx -y tsx scripts/health-check.ts

  bansos-status:
    runs-on: ubuntu-latest
    needs: health-check
    steps:
      - uses: actions/checkout@v4

      - name: Check keyless bansos endpoints
        run: |
          echo "## Bansos / Keyless Endpoint Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Endpoint | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY

          for entry in \
            "pollinations|https://text.pollinations.ai/models" \
            "ovhcloud|https://oai.endpoints.kepler.ai.cloud.ovh.net/v1/models" \
            "llm7|https://api.llm7.io/v1/models" \
            "kilo-gateway|https://api.kilo.ai/api/gateway/models" \
            "tokengratis-dir|https://tokengratis.id/api/providers"; do
            NAME="${entry%%|*}"
            URL="${entry#*|}"
            CODE=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "| $NAME | ✅ 200 |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $NAME | ⚠️ $CODE |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Update status timestamp
        run: |
          echo "Last checked: $(date -u '+%Y-%m-%d %H:%M UTC')" > data/last-check.txt || mkdir -p data && echo "Last checked: $(date -u '+%Y-%m-%d %H:%M UTC')" > data/last-check.txt

      - name: Commit status (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/last-check.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update health check timestamp [skip ci]"
          git push || echo "Push failed (expected on forked schedule runs)"
